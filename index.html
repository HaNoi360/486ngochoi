<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tour 360° – Tiện ích bên ngoài</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏙️</text></svg>">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pannellum/2.5.6/pannellum.css">
<style>
:root{--bg:#0f1419;--panel:rgba(15,20,25,.82);--text:#f2f4f7;--muted:#9aa5b1;--accent:#e8c27a;--air:#5cc8ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#panorama{position:fixed;inset:0}
.bar{position:fixed;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;gap:10px;align-items:center;pointer-events:none;z-index:10}
.bar>*{pointer-events:auto}
.chip{background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:10px 16px;font-size:15px;color:var(--text)}
#title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
button.chip{cursor:pointer;display:flex;align-items:center;gap:8px;font-family:inherit;flex:none}
button.chip:hover{border-color:var(--accent)}
.sp{flex:1}
#menu{position:fixed;top:0;bottom:0;left:0;width:min(320px,86vw);background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-right:1px solid rgba(255,255,255,.12);z-index:20;transform:translateX(-102%);transition:transform .25s ease;padding:max(16px,env(safe-area-inset-top)) 14px 20px;overflow-y:auto}
#menu.open{transform:none}
#menu h2{margin:6px 6px 14px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
#menu h3{margin:18px 6px 8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
#menu .x{background:none;border:0;color:var(--text);font-size:22px;cursor:pointer;line-height:1}
.item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:var(--text);font:inherit;font-size:15px;padding:11px 10px;border-radius:10px;cursor:pointer}
.item:hover{background:rgba(255,255,255,.07)}
.item.active{background:rgba(232,194,122,.16);color:var(--accent)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none}
.dot.air{background:var(--air)}
/* hotspots */
.hs{position:relative;width:22px;height:22px;border-radius:50%;background:rgba(232,194,122,.28);border:2px solid var(--accent);box-shadow:0 0 0 0 rgba(232,194,122,.5);animation:pulse 2s infinite;cursor:pointer}
.hs::after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--accent)}
.hs.air{background:rgba(92,200,255,.25);border-color:var(--air);animation-name:pulseAir}
.hs.air::after{background:var(--air)}
.hs .lbl{position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);white-space:nowrap;background:rgba(15,20,25,.88);color:#fff;font-size:13px;padding:5px 10px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .15s}
.hs:hover .lbl{opacity:1}
@keyframes pulse{70%{box-shadow:0 0 0 14px rgba(232,194,122,0)}100%{box-shadow:0 0 0 0 rgba(232,194,122,0)}}
@keyframes pulseAir{70%{box-shadow:0 0 0 14px rgba(92,200,255,0)}100%{box-shadow:0 0 0 0 rgba(92,200,255,0)}}
@media (hover:none){.hs .lbl{opacity:1;font-size:12px;padding:3px 8px}}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:30;transition:opacity .4s}
#loading.hide{opacity:0;pointer-events:none}
.pnlm-load-box{display:none!important}
.pnlm-controls-container{top:auto!important;bottom:max(14px,env(safe-area-inset-bottom));left:auto!important;right:12px}
.pnlm-controls{background:var(--panel)!important;border-radius:10px!important;border:1px solid rgba(255,255,255,.12)!important}
</style>
</head>
<body>
<div id="loading">Đang tải tour…</div>
<div id="panorama"></div>
<div class="bar">
  <button class="chip" id="openMenu" aria-label="Danh sách cảnh">☰ <span>Danh sách cảnh</span></button>
  <div class="chip" id="title"></div>
  <div class="sp"></div>
  <button class="chip" id="rot" title="Bật/tắt tự xoay">⟳ Tự xoay</button>
</div>
<nav id="menu" aria-label="Danh sách cảnh"></nav>

/* Nguồn ảnh: mặc định lấy từ Google Drive (file phải để chế độ "Bất kỳ ai có đường liên kết").
   Nếu muốn tự host trên Cloudflare: tải ảnh về thư mục /panos, đặt tên <ID>.jpg rồi đổi LOCAL = true. */
const LOCAL = false;
const imgUrl = id => LOCAL ? "panos/" + id + ".jpg" : "https://lh3.googleusercontent.com/d/" + id + "=s0";

const pretty = id => id.replace(/_/g, " ");
const ids = Object.keys(TOUR.scenes);
const aerial = new Set();
ids.forEach(i => TOUR.scenes[i].hotSpots.forEach(h => { if (h.cssClass === "Flycam") aerial.add(h.sceneId); }));
ids.forEach(i => { if (/trên cao/.test(pretty(i))) aerial.add(i); });

const scenes = {};
ids.forEach(id => {
  const s = TOUR.scenes[id];
  scenes[id] = {
    title: pretty(id),
    type: "equirectangular",
    panorama: imgUrl(s.panorama),
    pitch: s.pitch, yaw: s.yaw,
    hotSpots: s.hotSpots.map(h => ({
      pitch: h.pitch, yaw: h.yaw, type: "info", text: h.text,
      createTooltipFunc: (div, args) => {
        div.classList.add("hs"); if (h.cssClass === "Flycam") div.classList.add("air");
        const l = document.createElement("span"); l.className = "lbl"; l.textContent = args; div.appendChild(l);
      },
      createTooltipArgs: h.text,
      clickHandlerFunc: () => go(h.sceneId)
    }))
  };
});

const viewer = pannellum.viewer("panorama", {
  default: { firstScene: TOUR.default.firstScene, sceneFadeDuration: 800, autoLoad: TOUR.default.autoLoad,
             autoRotate: -TOUR.default.autoRotate, autoRotateInactivityDelay: 4000, compass: false, showControls: true, hfov: 100 },
  scenes
});

const titleEl = document.getElementById("title"), menu = document.getElementById("menu"), loading = document.getElementById("loading");
function go(id){ viewer.loadScene(id); closeMenu(); }
function mark(){
  const cur = viewer.getScene();
  titleEl.textContent = pretty(cur);
  menu.querySelectorAll(".item").forEach(b => b.classList.toggle("active", b.dataset.id === cur));
  document.title = pretty(cur) + " – Tour 360°";
}
function buildMenu(){
  const g = (label, list) => `<h3>${label}</h3>` + list.map(i => `<button class="item" data-id="${i}"><span class="dot ${aerial.has(i)?"air":""}"></span>${pretty(i)}</button>`).join("");
  menu.innerHTML = `<h2>Tour 360° <button class="x" aria-label="Đóng">×</button></h2>` +
    g("Trên cao (Flycam)", ids.filter(i => aerial.has(i))) + g("Trải nghiệm dưới mặt đất", ids.filter(i => !aerial.has(i)));
  menu.querySelectorAll(".item").forEach(b => b.onclick = () => go(b.dataset.id));
  menu.querySelector(".x").onclick = closeMenu;
}
function closeMenu(){ menu.classList.remove("open"); }
document.getElementById("openMenu").onclick = () => menu.classList.toggle("open");
let rotOn = true;
document.getElementById("rot").onclick = () => {
  rotOn = !rotOn;
